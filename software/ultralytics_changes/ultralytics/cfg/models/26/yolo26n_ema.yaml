# YOLO26n with EMA attention at P3 and P4 neck positions
# Based on yolo26.yaml — EMA inserted after C3k2 at layers 13 and 16

nc: 6  # PCB defect classes
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]

# Backbone (unchanged)
backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, Conv, [512, 3, 2]]          # 5-P4/16
  - [-1, 2, C3k2, [512, True]]          # 6
  - [-1, 1, Conv, [1024, 3, 2]]         # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]   # 9
  - [-1, 2, C2PSA, [1024]]              # 10

# Head with EMA inserted at P4 (layer 13) and P3 (layer 16)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]]                   # 13 P4 fusion
  - [-1, 1, EMA, [128]]                          # 14 EMA at P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 15
  - [[-1, 4], 1, Concat, [1]]                    # 16 cat backbone P3
  - [-1, 2, C3k2, [256, True]]                   # 17 P3 fusion (small objects)
  - [-1, 1, EMA, [64]]                          # 18 EMA at P3 — mouse bite & spur

  - [-1, 1, Conv, [256, 3, 2]]                   # 19
  - [[-1, 14], 1, Concat, [1]]                   # 20 cat head P4 (now points to EMA output)
  - [-1, 2, C3k2, [512, True]]                   # 21 P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]]                   # 22
  - [[-1, 10], 1, Concat, [1]]                   # 23 cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]]       # 24 P5/32-large

  - [[18, 21, 24], 1, Detect, [nc]]              # Detect(P3-EMA, P4, P5)
