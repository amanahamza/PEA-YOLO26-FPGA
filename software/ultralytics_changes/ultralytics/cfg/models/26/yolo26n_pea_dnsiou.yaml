# YOLO26n with PCB Edge Attention (PEA) at P3 neck only
# PEA targets mouse bite (horizontal edge) and spur (vertical edge)
# at P3/8 — the small object detection scale

nc: 6
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]

# Backbone unchanged
backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

# Head — PEA inserted at P3 only (small object scale)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12
  - [-1, 2, C3k2, [512, True]]                   # 13 P4 fusion (no attention here)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15
  - [-1, 2, C3k2, [256, True]]                   # 16 P3 fusion
  - [-1, 1, PEA, [64, 4]]                        # 17 PEA at P3 — mouse bite & spur
                                                  # 64 = 256×0.25, groups=4

  - [-1, 1, Conv, [256, 3, 2]]                   # 18
  - [[-1, 13], 1, Concat, [1]]                   # 19
  - [-1, 2, C3k2, [512, True]]                   # 20 P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]]                   # 21
  - [[-1, 10], 1, Concat, [1]]                   # 22
  - [-1, 1, C3k2, [1024, True, 0.5, True]]       # 23 P5/32-large

  - [[17, 20, 23], 1, Detect, [nc]]              # Detect(P3-PEA, P4, P5)
